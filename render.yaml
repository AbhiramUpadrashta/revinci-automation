# One-click deploy on Render (free plan): New ▸ Blueprint ▸ pick this repo, or use the Deploy button in the README.
services:
  - type: web
    name: revinci-automation
    runtime: docker
    plan: free
    healthCheckPath: /api/config
    envVars:
      - key: HOSTED
        value: "1"
      - key: APP_PASSWORD
        sync: false        # Render asks you to choose the panel password on deploy
